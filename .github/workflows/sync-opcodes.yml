name: Sync opcodes

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: sync-opcodes

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ffcafe/elpis-network sync
      - run: pnpm build
      - run: pnpm check:dist
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No opcode changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(network): sync opcodes'
          git push origin HEAD:main
